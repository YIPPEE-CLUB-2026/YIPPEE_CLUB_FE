B','text-link')]]));case'support':return panel('문의 · 프로모션','문의와 공지, 이벤트를 관리합니다. · 예시','<div class="module-tabs"><span class="selected">1:1 문의</span><span>리뷰</span><span>공지사항</span><span>쿠폰 · 포인트</span></div>'+table(['유형','제목','회원','접수일','상태',''],[['다운로드','PDF를 다시 받을 수 있나요?','샘플 회원 A','2026. 11. 25.',badge('답변 대기'),btn('답변 ↗','support','','text-link')],['활동 문의','가위 활동은 어떻게 도와주나요?','샘플 회원 B','2026. 11. 24.',badge('답변 완료'),btn('열기 ↗','support','','text-link')]]),btn('+ 공지 등록','notice','','primary'));case'settings':return panel('시스템 · 권한 설정','배포와 권한 구성을 보여주는 예시 화면입니다.','<div class="integration-list">'+[['관리자 권한','일반 관리자 · 검수 담당자 · 콘텐츠 담당자','설정 예시'],['접속 정책','별도 도메인 · 관리자 전용 로그인','설정 예시'],['관리자 활동 로그','수정 · 승인 · 반려 기록','설정 예시'],['프리뷰 연결','이 HTML은 서버로 요청하지 않습니다','연결 없음']].map(s=>'<div><div><strong>'+s[0]+'</strong><p>'+s[1]+'</p></div>'+badge(s[2])+'</div>').join('')+'</div>');}}

function reviewDetail(id){const r=reviews.find(r=>String(r.id)===id);openModal('인증 #'+id+' 검수 · 예시','<div class="review-layout"><div class="photo-demo"><div class="sample-paper"><small>'+esc(r.code)+'</small><h3>실선이랑 점선이랑</h3><div class="paper-lines">〰 ✂<br>······<br>☆ ♡</div></div><small>실제 사진이 아닌 UI 배치 예시입니다.</small></div><div><span class="eyebrow">AI & DATABASE CHECK</span><h3 style="margin-top:12px">'+r.member+'님의 놀이 기록</h3><div class="result-grid"><div><small>인식 코드</small><strong>'+r.code+'</strong></div><div><small>인식 신뢰도</small><strong>'+r.confidence+'</strong></div><div><small>발급 계정 일치</small>'+badge(r.matched?'일치':'불일치')+'</div><div><small>학습지 채움 여부</small>'+badge(r.filled?'완료':'미완료')+'</div><div><small>중복 인증 여부</small>'+badge('중복 없음')+'</div><div><small>현재 검수 상태</small>'+badge(r.status)+'</div></div><label>반려 사유<select id="reject-reason"><option>코드 미인식 / 잘림</option><option>다른 계정의 발급 코드</option><option>중복 인증</option><option>학습지 미완료</option></select></label><div class="actions">'+btn('반려','review-reject',id)+btn('승인','review-approve',id,'primary')+'</div></div></div>');}
function orderDetail(id){const o=orders.find(o=>String(o.id)===id);openModal('주문 #'+id+' · 예시','<div class="detail-summary">'+badge(o.status)+'<strong>'+won(o.amount)+'</strong></div><dl class="details"><dt>회원</dt><dd>'+o.user+'</dd><dt>학습지</dt><dd>'+o.title+'</dd><dt>결제 수단</dt><dd>토스페이먼츠 · 예시</dd><dt>주문 시각</dt><dd>'+o.time+'</dd><dt>환불 고지 동의</dt><dd>'+o.time+'</dd></dl>'+table(['다운로드','최초 이용','마지막 이용'],[['2회','2026. 11. 25. 09:35','2026. 11. 25. 09:42']])+'<div class="actions">'+btn('상태 재확인','simulated','')+btn('환불 요청','refund','17','danger')+'</div>');}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();if(!logged)return;section=nav.dataset.nav;filter='';render();return;}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='close'){modal.close();return;}if(a==='logout'){logged=false;login();return;}if(a==='menu'){document.querySelector('.sidebar').classList.add('is-open');document.querySelector('.sidebar-shade').style.display='block';return;}if(a==='menu-close'){document.querySelector('.sidebar').classList.remove('is-open');b.style.display='none';return;}if(a==='refresh'){render();toast('예시 화면을 새로고침했습니다.');return;}if(a==='product'){productEditor(id);return;}if(a==='review'){reviewDetail(id);return;}if(a==='order'){orderDetail(id);return;}if(a==='review-approve'||a==='review-reject'){const r=reviews.find(r=>String(r.id)===id);r.status=a==='review-approve'?'승인':'반려';modal.close();render();toast('미리보기에서만 '+r.status+' 처리했습니다.');return;}if(a==='category'){openModal('카테고리 추가','<form id="category-form"><label>카테고리 이름<input name="name" required></label><button class="primary">미리보기 추가</button></form>');return;}if(a==='refund'){openModal('환불 요청 #'+id+' · 예시','<p class="modal-description">샘플 회원의 환불 사유와 다운로드 이력을 검토합니다.</p><dl class="details"><dt>사유</dt><dd>아이가 다른 활동을 원해요</dd><dt>환불 고지 동의</dt><dd>2026. 11. 25. 09:32</dd><dt>다운로드</dt><dd>0회</dd></dl><label>관리자 메모<textarea rows="3" placeholder="반려 시 회원에게 전달할 사유"></textarea></label><div class="actions">'+btn('반려 예시','simulated')+btn('승인 예시','simulated','','primary')+'</div>');return;}if(a==='member'){openModal('샘플 회원 '+id,'<div class="member-card"><span class="avatar large">Y</span><div><h3>샘플 회원 '+id+'</h3><p>sample@example.com</p></div>'+badge('이용 중')+'</div><dl class="details"><dt>등록한 아이</dt><dd>샘플 아이 · 만 3세</dd><dt>구매한 학습지</dt><dd>3개 · 예시</dd><dt>달성한 도전과제</dt><dd>2개 · 예시</dd></dl><div class="actions">'+btn('계정 정지 예시','simulated','','danger')+'</div>');return;}if(a==='support'||a==='notice'){openModal(a==='notice'?'공지 등록 · 예시':'문의 답변 · 예시','<form id="note-form"><label>제목<input value="'+(a==='notice'?'새로운 놀이 소식':'PDF를 다시 받을 수 있나요?')+'"></label><label>내용<textarea rows="6" placeholder="내용을 입력하세요"></textarea></label><button class="primary">미리보기 저장</button></form>');return;}if(a==='simulated'){modal.close();toast('UI 동작 예시입니다. 실제 처리는 발생하지 않았습니다.');}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,fd=new FormData(form);if(form.id==='login'){name=String(fd.get('name')).trim()||'미리보기 관리자';logged=true;form.reset();render();return;}if(form.id==='product-search'){productQuery=String(fd.get('q')).trim();render();return;}if(form.id==='product-form'){const id=form.dataset.id;const p=products.find(p=>String(p.id)===id);const value={title:String(fd.get('title')),price:Number(fd.get('price')),age:String(fd.get('age')),status:String(fd.get('status'))};if(p)Object.assign(p,value);else products.unshift({...value,id:Math.max(...products.map(p=>p.id))+1,rental:null,icon:'✳'});modal.close();render();toast('예시 데이터에만 저장했습니다.');return;}if(form.id==='category-form'){categories.push(String(fd.get('name')).trim());modal.close();render();toast('미리보기 카테고리를 추가했습니다.');return;}if(form.id==='member-search'){toast('검색 동작 예시입니다. 표시된 회원은 샘플입니다.');return;}if(form.id==='code-search'){toast('코드 검색 동작 예시입니다. 실제 발급 이력은 조회하지 않습니다.');return;}modal.close();toast('미리보기에서만 저장했습니다.');});
const decoratedDashboard = dashboard;

const originalRender = render;
render = function() {
  originalRender();
  if (!logged) return;
  document.querySelector('.welcome-banner')?.remove();
  const intro = document.querySelector('.page-heading p');
  if (intro) intro.textContent = ({overview:'확인이 필요한 항목과 최근 주문입니다.',products:'학습지 파일과 판매 정보를 관리합니다.',categories:'학습지 분류를 관리합니다.',downloads:'발급 코드와 다운로드 기록을 확인합니다.',challenges:'사진과 판독 결과를 확인하고 승인 또는 반려합니다.',orders:'주문과 결제 상태를 확인합니다.',refunds:'환불 사유와 이용 기록을 확인합니다.',members:'회원 정보와 이용 상태를 관리합니다.',support:'문의와 공지사항을 관리합니다.',settings:'운영 설정을 확인합니다.'})[section];
  document.querySelectorAll('.eyebrow,.heading-dot,.subtle-pill,.stat-card i,.todo-icon').forEach(el=>el.remove());
  document.querySelectorAll('.brand').forEach(el=>el.innerHTML='YIPPEE CLUB<small>관리자</small>');
  document.querySelectorAll('.nav-group').forEach(el=>{ if(el.textContent==='OVERVIEW') el.textContent='관리'; });
  document.querySelectorAll('.stat-card p').forEach(el=>el.remove());
  const footer=document.querySelector('footer'); if(footer) footer.innerHTML='관리자 화면 미리보기';
};

  app.innerHTML='<main class="plain-login"><div class="plain-login-card"><div class="plain-wordmark">YIPPEE CLUB</div><h1>관리자 로그인</h1><p>화면 확인용입니다. 아무 값이나 입력하세요.</p><form id="login"><label>아이디<input name="name" autocomplete="off" required></label><label>비밀번호<input name="password" type="password" autocomplete="off" required></label><button class="primary full">로그인</button></form></div></main>';
};
